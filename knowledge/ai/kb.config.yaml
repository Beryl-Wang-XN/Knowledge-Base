# AI 知识库配置
# 该文件描述本知识库的元信息与更新行为，由 shared/ 中的通用工具读取。

name: ai
title: AI 知识库
description: MaaS TokenHub 用的 AI 技术侧知识库，按 A–G 模块组织。

# 必须与 entries/ 下的目录名一致。scripts/validate.py 按这个列表检查。
# G 模型档案在 registry/，不在 entries/。
categories:
  - A-model
  - B-inference
  - C-compute
  - D-serving
  - E-economics
  - F-landscape

# 本库不从这里拉情报。每天 08:00 的定时任务直接写 inbox/，不读这个列表。
# 留空，避免把关掉的示例 RSS 当成正在使用的更新源。
sources: []

# 与已启用的定时任务一致：每天 08:00 只把过去 24 小时、且已对过一手源的情报写入 inbox/（status: open）。
# 定时任务只改 inbox/ 并直推 feature/beryl-build-knowledge-base；不新开分支/PR，不写 entries、registry、daily、publish、progress、learning-plan。
# 若某天未推送，当天留空，不在次日补写。此处 cron 仅作说明，任务本身不读取上面的 sources。
schedule:
  cron: "0 8 * * *"   # 每天 08:00

# 索引配置
index:
  output: index/
  build_search_index: true

# 呈现。播客音色由 scripts/synthesize_podcast.py 读取。
publish:
  podcast:
    engine: edge-tts
    voice: zh-CN-XiaoxiaoNeural
    voice_label: 晓晓
  xiaoyuzhou:
    site: https://podcaster.xiaoyuzhoufm.com
    pid: 6ad87d5c40b919d77a370338
    title: "beryl's AI learning"
    title_max: 20
    title_review: pending
    episode: 待主体认证后存草稿
